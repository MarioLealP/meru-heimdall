# heimdall's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: heimdall
owner: mario
image:
  repository: zot.clockmost.com/meru/heimdall
  digest: sha256:acf20df8b641c7ddde5f656e5870f6003262c30f237d2e61bf7cea9ab301e9b2
  tag: "262111ad4bc6"
port: 8080
heartbeat:
  readyPath: /ready # Temporal answers over mTLS
# Its one login (D100-D104): its own Kubernetes token, for Temporal (heimdall:write) + Thoth
# (thoth.report:k8s-scan@clockmost) tokens - the groups in infra heimdall.yaml list heimdall/heimdall. No secret.
authentikLogin:
  enabled: true
# Its client certificate for Temporal's front door (D70), mounted where the settings look (tls_dir).
certificate:
  enabled: true
kubernetesApi:
  enabled: true # lists namespaces + Deployments/StatefulSets/DaemonSets (Meru/meru rbac/heimdall-reads-cluster.yaml)
# Size medium (its request in Meru/requests): Python + the Temporal worker, ~85 MiB like Shikigami's.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
# Nothing calls Heimdall (D97): only the node, for the kubelet's probes - not Docker's range, no namespaces.
networkPolicy:
  enabled: true
  hostAddresses: [10.42.0.1/32]

# Crash reports (D125): this app's GlitchTip project, which Shikigami made (it predates the marker's own DSN line).
glitchtip:
  dsn: https://79b0c05134444f269c6ada1e82bb897e@glitchtip.clockmost.com/1
